<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>my-wiki</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1f2328;
        --muted: #57606a;
        --line: #d8dee4;
        --accent: #0969da;
        --sidebar: #f0f3f6;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; }
      body {
        font: 15px/1.65 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      #app { display: flex; height: 100vh; }
      #sidebar {
        width: 280px; min-width: 280px; height: 100%;
        background: var(--sidebar); border-right: 1px solid var(--line);
        display: flex; flex-direction: column; overflow: hidden;
      }
      #search {
        margin: 12px; padding: 8px 10px; border: 1px solid var(--line);
        border-radius: 6px; font-size: 14px; outline: none;
      }
      #search:focus { border-color: var(--accent); }
      #list { overflow-y: auto; padding: 0 8px 16px; }
      .group h2 {
        font-size: 12px; text-transform: uppercase; letter-spacing: .05em;
        color: var(--muted); margin: 14px 6px 6px;
      }
      .group ul { list-style: none; margin: 0; padding: 0; }
      .group li a {
        display: block; padding: 5px 8px; border-radius: 6px;
        color: var(--fg); text-decoration: none; white-space: nowrap;
        overflow: hidden; text-overflow: ellipsis;
      }
      .group li a:hover { background: #e3e8ee; }
      .group li.active a { background: var(--accent); color: #fff; }
      #content { flex: 1; overflow-y: auto; padding: 32px 48px; max-width: 860px; }
      .page h1, .page h2, .page h3 { line-height: 1.3; }
      .page h2 { border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: 28px; }
      .page a.wikilink { color: var(--accent); text-decoration: none; }
      .page a.wikilink:hover { text-decoration: underline; }
      .deadlink { color: #cf222e; border-bottom: 1px dotted #cf222e; cursor: help; }
      .page code { background: #eef1f4; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
      .page pre { background: #eef1f4; padding: 12px; border-radius: 6px; overflow-x: auto; }
      .page pre code { background: none; padding: 0; }
      .page blockquote {
        margin: 8px 0; padding: 4px 14px; border-left: 3px solid var(--line); color: var(--muted);
      }
      .backlinks { margin-top: 36px; padding-top: 12px; border-top: 1px dashed var(--line); }
      .backlinks h3 { font-size: 14px; color: var(--muted); }
      .backlinks ul { padding-left: 18px; }
      .err { color: #cf222e; }
      #chat-toggle {
        position: fixed; right: 18px; bottom: 18px; z-index: 20;
        background: var(--accent); color: #fff; border: none; border-radius: 999px;
        padding: 10px 16px; font-size: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.18);
      }
      #chat {
        position: fixed; right: 18px; bottom: 70px; z-index: 20; width: 380px; max-width: 92vw;
        height: 60vh; max-height: 560px; display: flex; flex-direction: column;
        background: #fff; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
        box-shadow: 0 8px 28px rgba(0,0,0,.18);
      }
      #chat.hidden { display: none; }
      #chat-head {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; background: var(--accent); color: #fff; font-weight: 600;
      }
      #chat-close { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; line-height: 1; }
      #chat-log { flex: 1; overflow-y: auto; padding: 12px 14px; font-size: 14px; }
      #chat-log .msg { margin-bottom: 10px; line-height: 1.55; }
      #chat-log .msg b { color: var(--muted); margin-right: 4px; }
      #chat-log .msg.you b { color: var(--accent); }
      #chat-log details { margin: 4px 0 0 14px; font-size: 12px; color: var(--muted); }
      #chat-log details .step { margin: 4px 0; white-space: pre-wrap; }
      #chat-log .warn { color: #cf222e; margin-top: 4px; }
      #chat-form { display: flex; border-top: 1px solid var(--line); }
      #chat-input { flex: 1; border: none; padding: 10px 12px; font-size: 14px; outline: none; }
      #chat-form button {
        border: none; background: var(--accent); color: #fff; padding: 0 16px; cursor: pointer; font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <input id="search" type="search" placeholder="搜索标题 / 摘要…" />
        <div id="list"><p style="color:#57606a;padding:8px">加载中…</p></div>
      </aside>
      <main id="content"><p style="color:#57606a">加载中…</p></main>
    </div>

    <button id="chat-toggle" title="与知识库对话">💬 对话</button>
    <aside id="chat" class="hidden">
      <div id="chat-head">与 wiki 对话 <button id="chat-close" title="关闭">×</button></div>
      <div id="chat-log"><p style="color:#57606a">问点什么，agent 会多步检索、溯源、核对争议。</p></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="例如：RAG 和 LLM Wiki 有什么区别？" autocomplete="off" />
        <button type="submit">发送</button>
      </form>
    </aside>

    <script>
      var INDEX = null;
      var current = null;
      function el(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }
      function byType(t) {
        return INDEX.pages.filter(function (p) { return p.type === t; });
      }
      function renderSidebar(filter) {
        filter = (filter || '').toLowerCase();
        var groups = [['concept', '概念'], ['entity', '实体'], ['source', '素材']];
        var html = '';
        for (var gi = 0; gi < groups.length; gi++) {
          var t = groups[gi][0], label = groups[gi][1];
          var items = byType(t).filter(function (p) {
            if (!filter) return true;
            var hay = (p.title + ' ' + p.oneLiner + ' ' + (p.aliases || []).join(' ')).toLowerCase();
            return hay.indexOf(filter) >= 0;
          });
          if (items.length === 0) continue;
          html += '<div class="group"><h2>' + label + ' (' + items.length + ')</h2><ul>';
          for (var i = 0; i < items.length; i++) {
            var p = items[i];
            var cls = p.id === current ? 'active' : '';
            html += '<li class="' + cls + '"><a href="#/page/' +
              encodeURIComponent(p.id) + '">' + esc(p.title) + '</a></li>';
          }
          html += '</ul></div>';
        }
        if (html === '') html = '<p style="color:#57606a;padding:8px">无匹配</p>';
        el('list').innerHTML = html;
      }
      function loadPage(id) {
        current = id;
        renderSidebar(el('search').value);
        var req = new XMLHttpRequest();
        req.open('GET', '/page/' + encodeURIComponent(id), true);
        req.onreadystatechange = function () {
          if (req.readyState === 4) {
            if (req.status === 200) {
              el('content').innerHTML = req.responseText;
              document.title = id + ' · my-wiki';
            } else {
              el('content').innerHTML = '<p class="err">加载失败：' + esc(id) + ' (' + req.status + ')</p>';
            }
          }
        };
        req.send();
      }
      function onHash() {
        var m = location.hash.match(/^#\/page\/(.+)$/);
        if (m) { loadPage(decodeURIComponent(m[1])); }
        else if (INDEX && INDEX.pages.length) { loadPage(INDEX.pages[0].id); }
      }
      function init() {
        var req = new XMLHttpRequest();
        req.open('GET', '/api/index.json', true);
        req.onreadystatechange = function () {
          if (req.readyState === 4 && req.status === 200) {
            INDEX = JSON.parse(req.responseText);
            renderSidebar('');
            onHash();
          }
        };
        req.send();
        el('search').addEventListener('input', function () { renderSidebar(this.value); });
      }
      window.addEventListener('hashchange', onHash);
      window.addEventListener('DOMContentLoaded', init);

      // ---- Agent 聊天侧栏 ----
      var agentSeed = '';
      function appendChat(who, text, raw) {
        var log = el('chat-log');
        var p = document.createElement('div');
        p.className = 'msg ' + who;
        p.innerHTML = '<b>' + (who === 'you' ? '你' : 'Agent') + '</b>' + esc(text);
        log.appendChild(p);
        if (raw && who === 'agent') {
          var details = document.createElement('details');
          var summary = document.createElement('summary');
          summary.textContent = '思考过程（' + raw.steps.length + ' 步）';
          details.appendChild(summary);
          raw.steps.forEach(function (s) {
            var d = document.createElement('div');
            d.className = 'step';
            d.innerHTML =
              '[思考] ' + esc(s.thought) + '\n' +
              '[动作] ' + esc(s.action) + (s.actionInput ? ' ' + esc(JSON.stringify(s.actionInput)) : '') + '\n' +
              (s.observation ? '[观察] ' + esc(s.observation) : '');
            details.appendChild(d);
          });
          if (raw.citations && raw.citations.length) {
            var c = document.createElement('div');
            c.className = 'warn';
            c.textContent = '引用校验失败：' + raw.citations.join(', ');
            details.appendChild(c);
          }
          log.appendChild(details);
        }
        log.scrollTop = log.scrollHeight;
      }
      function agentAsk(q) {
        appendChat('you', q);
        var req = new XMLHttpRequest();
        req.open('POST', '/api/agent', true);
        req.setRequestHeader('Content-Type', 'application/json');
        req.onreadystatechange = function () {
          if (req.readyState === 4) {
            if (req.status === 200) {
              var data = JSON.parse(req.responseText);
              appendChat('agent', data.answer, data);
              agentSeed = data.transcript || '';
            } else {
              appendChat('agent', '请求失败：' + req.status);
            }
          }
        };
        req.send(JSON.stringify({ question: q, seedTranscript: agentSeed }));
      }
      el('chat-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var input = el('chat-input');
        var q = input.value.trim();
        if (!q) return;
        input.value = '';
        agentAsk(q);
      });
      el('chat-toggle').addEventListener('click', function () { el('chat').classList.toggle('hidden'); });
      el('chat-close').addEventListener('click', function () { el('chat').classList.add('hidden'); });
    </script>
  </body>
</html>
